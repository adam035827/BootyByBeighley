services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: booty_by_beighley_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Testpass123!
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  course-environment:
    image: bootybybeighley-course-environment:latest
    build: .
    stdin_open: true
    tty: true
    working_dir: /workspace
    volumes:
      - .:/workspace
      - claude-auth:/claude-auth
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=booty_by_beighley_dev;User Id=postgres;Password=Testpass123!"
    ports:
      - "5118:5118"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  claude-auth:
