<div class="todo-form">
  <h2 class="todo-form__title">{{ isEditMode() ? 'Edit Item' : 'New Item' }}</h2>

  @if (errorMessage()) {
    <p class="todo-form__error" role="alert">{{ errorMessage() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="todo-form__form">
    <div class="todo-form__field">
      <label class="todo-form__label" for="title">Title <span aria-hidden="true">*</span></label>
      <input
        id="title"
        type="text"
        formControlName="title"
        class="todo-form__input"
        [class.todo-form__input--error]="form.controls.title.invalid && form.controls.title.touched"
        placeholder="What needs to be done?"
      />
      @if (form.controls.title.invalid && form.controls.title.touched) {
        <span class="todo-form__field-error" role="alert">Title is required (max 200 characters).</span>
      }
    </div>

    <div class="todo-form__field">
      <label class="todo-form__label" for="description">Description</label>
      <textarea
        id="description"
        formControlName="description"
        class="todo-form__textarea"
        rows="3"
        placeholder="Optional notes…"
      ></textarea>
    </div>

    @if (isEditMode()) {
      <div class="todo-form__field todo-form__field--inline">
        <input id="isCompleted" type="checkbox" formControlName="isCompleted" />
        <label class="todo-form__label" for="isCompleted">Mark as completed</label>
      </div>
    }

    <div class="todo-form__actions">
      <button type="submit" class="btn btn--primary" [disabled]="form.invalid || isSubmitting()">
        {{ isSubmitting() ? 'Saving…' : (isEditMode() ? 'Save Changes' : 'Create Item') }}
      </button>
      <button type="button" class="btn btn--secondary" (click)="cancel()">Cancel</button>
    </div>
  </form>
</div>
